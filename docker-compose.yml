services:
  web:
    build: .
    restart: unless-stopped
    environment:
      AI_SOC_ENV: production
      AI_SOC_BIND: 0.0.0.0
      AI_SOC_REQUIRE_WORKER: "1"
      AI_SOC_SESSION_SECRET: ${AI_SOC_SESSION_SECRET:?set AI_SOC_SESSION_SECRET}
      AI_SOC_CREDENTIAL_KEY: ${AI_SOC_CREDENTIAL_KEY:?set AI_SOC_CREDENTIAL_KEY}
    ports:
      - "127.0.0.1:${AI_SOC_PORT:-5051}:5000"
    volumes: &soc_volumes
      - soc_data:/app/data
      - soc_audit:/app/audit
      - soc_evidence:/app/evidence
      - soc_reports:/app/reports/generated
      - soc_backups:/app/backups
      - soc_skills:/app/skills/generated
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "scripts.operations_worker", "--interval", "15"]
    environment:
      AI_SOC_ENV: production
      AI_SOC_SESSION_SECRET: ${AI_SOC_SESSION_SECRET:?set AI_SOC_SESSION_SECRET}
      AI_SOC_CREDENTIAL_KEY: ${AI_SOC_CREDENTIAL_KEY:?set AI_SOC_CREDENTIAL_KEY}
      AI_SOC_SLACK_WEBHOOK_URL: ${AI_SOC_SLACK_WEBHOOK_URL:-}
      AI_SOC_SMTP_HOST: ${AI_SOC_SMTP_HOST:-}
      AI_SOC_NOTIFY_EMAIL_TO: ${AI_SOC_NOTIFY_EMAIL_TO:-}
    volumes: *soc_volumes
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  celery-worker:
    profiles: ["scaleout"]
    build: .
    restart: unless-stopped
    command: ["celery", "-A", "scripts.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=4"]
    environment:
      AI_SOC_ENV: production
      AI_SOC_SESSION_SECRET: ${AI_SOC_SESSION_SECRET:?set AI_SOC_SESSION_SECRET}
      AI_SOC_CREDENTIAL_KEY: ${AI_SOC_CREDENTIAL_KEY:?set AI_SOC_CREDENTIAL_KEY}
    volumes: *soc_volumes
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    profiles: ["scaleout"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AI_SOC_POSTGRES_DB:-ai_soc_operator}
      POSTGRES_USER: ${AI_SOC_POSTGRES_USER:-ai_soc}
      POSTGRES_PASSWORD: ${AI_SOC_POSTGRES_PASSWORD:-change-before-scaleout}
    volumes:
      - soc_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    profiles: ["scaleout"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - soc_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  soc_data:
  soc_audit:
  soc_evidence:
  soc_reports:
  soc_backups:
  soc_skills:
  soc_postgres:
  soc_redis:
