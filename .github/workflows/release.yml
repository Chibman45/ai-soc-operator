name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to belong to main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install the hash-locked CI environment
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Reject stale dependency locks
        run: |
          # Preserve reviewed transitive versions while checking source compatibility.
          cp requirements.lock /tmp/requirements.lock
          cp requirements-ci.lock /tmp/requirements-ci.lock
          uv pip compile requirements.txt --python-version 3.10 --universal --generate-hashes --no-header --output-file /tmp/requirements.lock
          uv pip compile requirements.txt requirements-dev.txt --python-version 3.10 --universal --generate-hashes --no-header --output-file /tmp/requirements-ci.lock
          diff -u requirements.lock /tmp/requirements.lock
          diff -u requirements-ci.lock /tmp/requirements-ci.lock
      - run: python -m pip check
      - run: python -m compileall scripts tests web
      - run: python -m pytest tests -q
      - run: python -m bandit -q -ll -r scripts web -x tests
      - run: python -m pip_audit -r requirements.lock
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Derive immutable image coordinates
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "quarantine_tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$image:$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push an unpromoted image digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          pull: true
          tags: ${{ steps.image.outputs.quarantine_tag }}
          provenance: mode=max
          sbom: true
      - name: Scan the exact candidate digest before release promotion
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          cache: false
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate the release SBOM from the qualified digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Promote only the qualified digest to the version tag
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ steps.image.outputs.release_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create --tag "$RELEASE_TAG" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')" = "$DIGEST"
          printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the immutable release digest with GitHub OIDC
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Bind the SPDX SBOM to the released image digest
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
      - name: Preserve release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-${{ github.ref_name }}
          path: |
            sbom.spdx.json
            image-digest.txt
          if-no-files-found: error
          retention-days: 90
