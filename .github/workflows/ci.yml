name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt pip-audit bandit
      - run: python -m compileall scripts tests web
      - run: python -m pytest tests -q --cov=scripts --cov=web --cov-report=term-missing
      - run: python -m bandit -q -r scripts web -x tests
      - run: python -m pip_audit -r requirements.txt

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-soc-operator:ci
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ai-soc-operator:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
