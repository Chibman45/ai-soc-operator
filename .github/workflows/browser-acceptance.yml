name: browser-acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install application and browser test dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Install Chromium with system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run Phase 5 browser acceptance
        env:
          AI_SOC_RUN_BROWSER_TESTS: "1"
        run: >-
          python -m pytest tests/e2e -q
          --browser chromium
          --tracing retain-on-failure
          --screenshot only-on-failure
          --output test-results
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-acceptance-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
